version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: trustmed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-trustmed_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trustmed_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustmed-network

  # ----------------------------------------------------------------------------
  # TrustMed-AI FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustmed_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=TrustMed-AI Backend
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_change_me}@db:5432/${POSTGRES_DB:-trustmed_db}
      - SECRET_KEY=${SECRET_KEY:-trustmed-super-secret-key-change-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      - WEB3_PROVIDER_URI=${WEB3_PROVIDER_URI:-https://ethereum-rpc.publicnode.com}
      - WEB3_CHAIN_ID=${WEB3_CHAIN_ID:-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trustmed-network

  # ----------------------------------------------------------------------------
  # TrustMed-AI Next.js Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustmed_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - trustmed-network

volumes:
  postgres_data:
    driver: local

networks:
  trustmed-network:
    driver: bridge
